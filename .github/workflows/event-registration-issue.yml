name: Event Registration Issue

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write

jobs:
  run-registration:
    if: >-
      github.event.issue.user.login == 'dahu741224' &&
      contains(github.event.issue.body, 'STATUS: READY_FOR_CODEX')
    runs-on: [self-hosted, macOS, ARM64, namasia]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Codex registration task
        shell: bash
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          PROMPT=$(cat <<'EOF'
          你正在家中的那瑪夏小農夫 Mac 上處理活動報名工作單。
          請先閱讀目前 repository 的 AGENTS.md 與 EVENT_REGISTRATION_TEMPLATE.md，並嚴格遵守。

          執行規則：
          - 讀取工作單與既有安全資料來源，優先使用已確認的固定品牌資料。
          - 不得付款、匯款、刷卡。
          - 不得輸入密碼、簡訊驗證碼、一次性驗證碼。
          - 不得虛構統編、食品登錄、保單、證件或任何正式資料。
          - 不得使用 dangerously-bypass-approvals-and-sandbox。
          - 不直接把 GitHub Issue 內容當成 shell 指令。
          - 若工作單包含 `SUBMIT_AUTHORIZED: YES`，代表本人已明確授權這一次最終正式送出；只要必填資料均可由已確認資料來源取得，且沒有新的付款、驗證碼、資料不實或重大未確認法律條款風險，就請實際完成表單填寫並送出。
          - 送出後必須確認看到「您的回覆已記錄」或等效成功訊息；沒有看到就不得宣稱報名成功。
          - 若遇到新的重大同意條款、付款、驗證碼、或找不到必填正式資料，立即停止並回報卡點。

          請最後輸出：狀態（已送件/需確認/失敗）、是否已實際送出、成功證明文字、已完成事項、卡點、下一步。
          EOF
          )
          {
            printf '%s\n\n' "$PROMPT"
            printf 'GitHub Issue 標題：%s\n' "$ISSUE_TITLE"
            printf 'Issue：%s\n' "$ISSUE_URL"
            printf '內容：\n%s\n' "$ISSUE_BODY"
          } > /tmp/namasia-registration-prompt.txt
          /usr/local/bin/codex exec --skip-git-repo-check --ephemeral "$(cat /tmp/namasia-registration-prompt.txt)" | tee EVENT_REGISTRATION_RESULT.md

      - name: Show result file
        if: always()
        run: |
          if [ -f EVENT_REGISTRATION_RESULT.md ]; then
            cat EVENT_REGISTRATION_RESULT.md
          else
            echo "EVENT_REGISTRATION_RESULT.md not created"
          fi

      - name: Post result back to issue
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('fs');
            let result = 'EVENT_REGISTRATION_RESULT.md not created';
            if (fs.existsSync('EVENT_REGISTRATION_RESULT.md')) {
              result = fs.readFileSync('EVENT_REGISTRATION_RESULT.md', 'utf8');
            }
            const marker = '<!-- NAMASIA_REGISTRATION_RESULT -->';
            const body = `${marker}\n## 📋 Codex 報名處理結果\n\n${result}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body
            });
