name: Runner Heartbeat

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-heartbeat.yml"

permissions:
  contents: read

concurrency:
  group: namasia-mac-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: [self-hosted, macOS, ARM64, namasia]
    timeout-minutes: 5
    steps:
      - name: Report Mac runner health
        shell: bash
        run: |
          set -euo pipefail

          checked_at="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          codex_version="not-found"
          if [ -x /usr/local/bin/codex ]; then
            codex_version="$(/usr/local/bin/codex --version | head -n 1)"
          fi

          {
            echo "## 那瑪夏小農夫 Mac Runner 心跳"
            echo
            echo "- 狀態：ONLINE"
            echo "- 檢查時間（UTC）：$checked_at"
            echo "- Runner：$RUNNER_NAME"
            echo "- 作業系統：$RUNNER_OS"
            echo "- 架構：$RUNNER_ARCH"
            echo "- 電腦名稱：$(hostname)"
            echo "- Codex：$codex_version"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "NAMASIA_RUNNER_HEARTBEAT=ONLINE"
          echo "CHECKED_AT=$checked_at"
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "MACHINE_NAME=$(hostname)"
          echo "CODEX_VERSION=$codex_version"
